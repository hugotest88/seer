version: 2.1

executors:
  default-executor:
    docker:
      - image: cimg/base:2024.01

jobs:
  wait-job:
    executor: default-executor
    steps:
      - run:
          name: Wait for 30 seconds
          command: sleep 30

  hello-world-job:
    executor: default-executor
    steps:
      - run:
          name: Echo Hello World
          command: echo "Hello World"

workflows:
  version: 2
  conditional-workflow:
    jobs:
      - wait-job
      - hello-world-job:
          requires:
            - wait-job
          filters:
            branches:
              only: /cancelled/
