version: 2.1

executors:
  qt-executor:
    docker:
      - image: cimg/base:current
    working_directory: ~/project

jobs:
  build:
    executor: qt-executor
    steps:
      - checkout
      - run:
          name: Update ubuntu
          command: sudo apt-get update
      - run:
          name: Install Qt5
          command: sudo apt-get install -y qtbase5-dev libqt5charts5-dev libqt5printsupport5
      - run:
          name: Set Qt5 Environment
          command: echo 'export CMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake/Qt5' >> $BASH_ENV
      - run:
          name: Configure CMake
          command: |
            if [ -f seer/src/CMakeLists.txt ]; then
              mkdir -p seer/src/build
              cd seer/src/build
              cmake -DQTVERSION=QT5 -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake/Qt5 ..
            else
              echo "CMakeLists.txt not found in the expected location."
              exit 1
            fi
      - run:
          name: Build SeerGDB
          command: |
            cd seer/src/build
            make seergdb
      - run:
          name: Install SeerGDB
          command: |
            cd seer/src/build
            sudo make install
      - run:
          name: Package as .deb
          command: |
            cd seer
            dpkg-buildpackage
workflows:
  build_and_release:
    jobs:
      - build