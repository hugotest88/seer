version: 2.1

executors:
  default-executor:
    docker:
      - image: cimg/base:2024.01

jobs:
  hello-world-job:
    executor: default-executor
    steps:
      - run:
          name: Echo Hello World
          command: echo "Hello World"

workflows:
  version: 2
  hello-world-workflow:
    jobs:
      - hello-world-job