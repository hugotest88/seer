version: 2.1

executors:
  linux-builder:
    docker:
      - image: cimg/base:2024.01
    resource_class: large

jobs:
  build-ubuntu:
    executor: linux-builder
    steps:
      - checkout

      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y cmake g++ \
                                  qt6-base-dev \
                                  qt6-charts-dev \
                                  libqt6svg6-dev \
                                  qt6-base-dev-tools \
                                  ninja-build

      - run:
          name: Configure CMake
          command: |
            cd src
            cmake -B build -DQTVERSION=QT6 -DCMAKE_BUILD_TYPE=Release

      - run:
          name: Build
          command: |
            cd src
            cmake --build build --config Release --target seergdb --parallel $(nproc)

      - run:
          name: Package Release
          command: |
            cd src/build
            cp ../../LICENSE .
            cp ../../CHANGELOG.md .
            tar zcvf seergdb.tar.gz LICENSE CHANGELOG.md seergdb

      - store_artifacts:
          path: src/build/seergdb.tar.gz
          destination: seergdb-linux.tar.gz

  build-debian-package:
    executor: linux-builder
    steps:
      - checkout

      - run:
          name: Install Build Dependencies
          command: |
            sudo apt-get update
            sudo apt-get -y install devscripts build-essential dpkg-dev equivs
            sudo mk-build-deps --install --tool='apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends --yes' debian/control

      - run:
          name: Build Debian Package
          command: dpkg-buildpackage --unsigned-source --unsigned-changes

      - store_artifacts:
          path: ../seergdb_*_amd64.deb
          destination: seergdb-debian.deb

workflows:
  version: 2
  build-all:
    jobs:
      - build-ubuntu
      - build-debian-package
